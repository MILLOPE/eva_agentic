[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eva-agentic"
version = "0.1.0"
description = "Lightweight, traceable robot-agent experiment orchestration"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
eva-agentic = "eva_agentic.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
