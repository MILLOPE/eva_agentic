# Copy outside the repository and replace every path and environment name.
resource_slots:
  gpu: [0, 1]
frameworks:
  rats_libero:
    conda_executable: /opt/conda/bin/conda
    environment: rats-libero
    env:
      # Set only variable names and values that the framework needs.
      # Keep API keys and model paths in this untracked file.
      RATS_PYTHON: python
  rpent_libero:
    interpreter: <PROJECT_ROOT>/.envs/eva-rpent-libero/bin/python
    env:
      # Keep endpoint addresses, model paths, and planner credentials only in
      # this untracked local profile.
      RPENT_VLA_ENDPOINT: 127.0.0.1:8113
      RPENT_SAM3_ENDPOINT: 127.0.0.1:8114
      LIBERO_CONFIG_PATH: <PROJECT_ROOT>/.envs/eva-rpent-libero/libero-config
      # If torch/RLinf are reused from a separately managed compatible runtime,
      # put its site-packages after this environment's site-packages here.
      # PYTHONPATH: <COMPATIBLE_RUNTIME_SITE_PACKAGES>
