frameworks:
  - name: rpent_libero
    backend: python
    workdir: ../third_party/frameworks/rpent
    command:
      - -m
      - rpent.cli.main
      - --planner
      - api
      - --model
      - openai:gpt-5.5
      - --memory-profile
      - hf
      - --max-turns
      - "20"
    resources:
      gpu: 1
    env:
      LIBERO_TYPE: standard
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
